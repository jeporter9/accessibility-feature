<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="James Porter">
    <meta name="description" content="This page includes content assisted by AI tools.">
    <title>Theme toggle feature by James Porter</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark {
            background-color: #000000;
            color: #ffffff;
        }

        #theme-toggle-container {
            position: fixed;
            top: 20px;
            right: 20px;
            cursor: pointer;
        }

        .icon {
            width: 36px;
            height: 36px;
            display: inline-block;
            background-image: url('accessible-icon.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .content {
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.25rem;
            line-height: 1.5;
        }

        .visually-hidden {
            border: 0;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            height: 1px;
            margin: -1px;
            overflow: hidden;
            padding: 0;
            position: absolute;
            width: 1px;
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <div id="theme-toggle-container">
        <span class="icon" aria-hidden="true"></span>
        <span class="visually-hidden">Accessibility Icon</span>
    </div>

    <main class="content">
        <h1>Welcome to the Accessibility Feature Demo</h1>
        <p>
            This page demonstrates a simple light/dark theme toggle feature implemented using JavaScript.
            Click the icon in the upper-right corner to switch between themes. Your preference will be saved for future
            visits.
        </p>
    </main>

    <script>
        // TODO: Add JavaScript here to handle theme toggling.
        // Hint: Use document.getElementById() to select the button.
        // Check the article for step-by-step guidance!
        const button = document.querySelector('#theme-toggle-container');

        /* button.addEventListener('click', () => {
            console.log('Button clicked!');
        }); */

        // Define a function to toggle themes
        function toggleTheme() {
            document.body.classList.toggle('dark');
            console.log('Button clicked!');

            const currentTheme = localStorage.getItem('theme');
            // Add logic to switch between themes (Assisted by CoPilot)
            if (currentTheme === 'dark') {
                document.body.classList.remove('dark');
                localStorage.setItem('theme', ''); // Change theme to empty                
            } else {
                document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark'); // Change theme to dark
            }
        }

        // Call the function when a button is clicked
        button.addEventListener('click', toggleTheme);


        // Retrieve the value
        const theme = localStorage.getItem('theme');
        console.log(`The selected theme is: ${theme}`);
        if (theme === 'dark') {
            document.body.classList.add('dark');
        }
        else {
            document.body.classList.remove('dark');
        }       
    </script>
</body>

</html>
